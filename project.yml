name: Vertex
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 27.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Vertex:
    type: application
    platform: iOS
    sources:
      - path: Vertex
    dependencies:
      - framework: StikPairFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertex.emulator
        INFOPLIST_FILE: Vertex/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vertex/Vertex.entitlements
        PRODUCT_NAME: Vertex
        OTHER_LDFLAGS: "-lc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

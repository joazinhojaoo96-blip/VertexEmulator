name: Vertex Madeira Runtime Build

on:
  push:
    branches:
      - feature/madeira-runtime-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-madeira-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    name: Build and validate Windows runtime
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout Vertex and pinned Madeira source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Apple build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version
          cargo --version

      - name: Verify pinned runtime source
        run: |
          test -f Vendor/Madeira/tools/build-ipa.sh
          test -f Vendor/Madeira/LICENSE
          test -f Vendor/Madeira/LICENSE-EXCEPTION.md
          git -C Vendor/Madeira submodule status --recursive
          git -C Vendor/Madeira rev-parse HEAD

      - name: Apply Vertex bundle identity and app icon
        run: python3 tools/brand-madeira-for-vertex.py

      - name: Build Vertex-branded runtime application
        working-directory: Vendor/Madeira
        env:
          JOBS: 4
        run: ./tools/build-ipa.sh

      - name: Validate resulting IPA
        run: |
          test -s Vendor/Madeira/dist/Madeira.ipa
          unzip -tq Vendor/Madeira/dist/Madeira.ipa
          python3 Vendor/Madeira/tools/build/runtime-components.py ipa Vendor/Madeira/dist/Madeira.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile
          ipa = "Vendor/Madeira/dist/Madeira.ipa"
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read("Payload/Madeira.app/Info.plist"))
          assert info["CFBundleIdentifier"] == "com.vertex.emulator", info.get("CFBundleIdentifier")
          assert info["CFBundleDisplayName"] == "Vertex", info.get("CFBundleDisplayName")
          assert any("vertex" in item.get("CFBundleURLSchemes", []) for item in info.get("CFBundleURLTypes", []))
          print("PASS: IPA bundle identity is Vertex")
          PY

      - name: Upload runtime validation IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-runtime-engine-validation
          path: Vendor/Madeira/dist/Madeira.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: iOS Build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Apple build tools
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust targets
        run: |
          rustc --version
          cargo --version
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build native pairing Rust framework
        run: |
          chmod +x build-rust.sh
          ./build-rust.sh
          test -d StikPairFFI.xcframework
          lipo -info build/libstikpair_ffi-simulator.a

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Vertex.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.vertex.emulator \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Vertex.xcarchive/Products/Applications/Vertex.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Vertex-unsigned.ipa
          test -s Vertex-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-native-pairing-IPA
          path: Vertex-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

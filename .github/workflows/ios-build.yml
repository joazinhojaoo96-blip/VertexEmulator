name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-ios-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime:
    name: Build the actual Vertex Windows runtime
    uses: ./.github/workflows/vertex-madeira-runtime.yml

name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Python runner syntax
        run: python3 -m py_compile VertexRunner/VertexRunner.py
      - name: Validate plist and entitlements
        run: |
          plutil -lint Vertex/Info.plist
          plutil -lint Vertex/Vertex.entitlements
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify generated scheme
        run: xcodebuild -list -project Vertex.xcodeproj

  build:
    name: Build iOS app
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show build tools
        run: |
          xcodebuild -version
          xcodegen --version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Vertex.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.vertex.emulator \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Vertex.xcarchive/Products/Applications/Vertex.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Vertex-unsigned.ipa
          test -s Vertex-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-unsigned-IPA
          path: Vertex-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
